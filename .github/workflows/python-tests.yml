name: Python tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Update apt cache and install libsystemd-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev git build-essential python3-setuptools python3-dev python3-pip python3-venv python3-wheel
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ".[dev]"
      - name: Run tests
        run: pytest
